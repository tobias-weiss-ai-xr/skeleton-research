# ⚙️ Research Taxonomy & Discovery Config
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Lie Groups: Theory & Applications"
  short: "lie-groups"                 # used in URLs, badges, docs paths
  description: "Literature corpus at the intersection of Lie group theory, representation theory, and modern applications — from classical structure theory and representations to equivariant/geometric machine learning and gauge-theoretic physics."
  github_pages: "https://tobias-weiss-ai-xr.github.io/lie-group-research"
  openalex_mailto: "tobias@tobias-weiss.org"  # polite-pool email for OpenAlex API

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis of your review (e.g. methods, applications, …).
# Subcategories = the secondary axis (e.g. architectures, benchmarks, …).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:                           # ordered list
    - id: survey
      display: "Surveys & Frameworks"
    - id: method
      display: "Theory & Representation"
    - id: application
      display: "Applications"
    - id: evaluation
      display: "Evaluation & Benchmarks"
  subcategories:
    - id: classical
      display: "Classical Theory & Structure"
    - id: representation
      display: "Representation Theory"
    - id: equivariant
      display: "Equivariant & Geometric ML"
    - id: physics
      display: "Physics & Geometry"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
# Keep them topic-specific; the script deduplicates automatically.
arxiv_queries:
  - query: 'cat:math.RT AND (abs:"Lie group" OR abs:"Lie algebra")'
    category: method
    subcategory_hint: classical
  - query: 'cat:math.RT AND abs:"representation theory"' 
    category: method
    subcategory_hint: representation
  - query: 'cat:hep-th AND (abs:"Lie group" OR abs:"gauge group" OR abs:"structure constants")'
    category: application
    subcategory_hint: physics
  - query: '(cat:cs.LG OR cat:cs.CV) AND abs:"Lie group"'
    category: application
    subcategory_hint: equivariant
  - query: '(cat:cs.LG OR cat:cs.CV) AND (abs:"equivariant" AND abs:"SO(3)") AND abs:"neural"'
    category: method
    subcategory_hint: equivariant
  - query: 'cat:math-ph AND (abs:"Lie group" OR abs:"de Rham" OR abs:"symplectic")'
    category: method
    subcategory_hint: physics

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
other_sources_queries:
  - source: dblp
    query: Lie group equivariant neural network
    category: application
    subcategory_hint: equivariant
  - source: crossref
    query: Lie group representation theory survey
    category: survey
    subcategory_hint: representation
  - source: europepmc
    query: Lie group equivariant deep learning
    category: application
    subcategory_hint: equivariant
  - source: openalex
    query: Lie group representation theory equivalence machine learning
    category: survey
    subcategory_hint: representation

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
openalex_queries:
  - category: method
    query: "Lie group representation theory"
  - category: application
    query: "Lie group equivariant neural network"
  - category: survey
    query: "Lie groups survey mathematics"

# ── Subcategory keywords (classify_subcategory in fetch_new_papers.py) ───────
subcategory_keywords:
  - id: classical
    keywords: [Lie group structure, simple Lie algebra, semisimple, Cartan, classification, root system]
  - id: representation
    keywords: [representation theory, characters, irreducible, highest weight, Verma, Young]
  - id: equivariant
    keywords: [equivariant, steerable, invariant, geometric deep learning, symmetry, group convolution]
  - id: physics
    keywords: [gauge, symmetry breaking, standard model, quantum field, supersymmetry, coset]

# ── Trend keywords (standard_stats.py momentum/gaps analysis) ────────────────
trend_keywords:
  - equivariant neural networks
  - steerable CNNs
  - group convolution
  - representation theory
  - gauge theory
  - geometry
  - neural operators
