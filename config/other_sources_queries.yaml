# Multi-source discovery queries (fetch_other_sources.py)
# Replace the example queries below with topic-specific ones.
# Sources supported: dblp, crossref, europepmc, openalex, semantic_scholar
#
# EXAMPLE: Kubernetes / Container Security queries
# (Uncomment and adapt these for your own topic, or remove them entirely)
# - source: crossref
#   query: "Kubernetes AND security AND RBAC"
#   category: security
#   subcategory_hint: systems
# - source: openalex
#   query: "container AND security AND isolation AND namespaces"
#   category: security
#   subcategory_hint: architecture
# - source: dblp
#   query: "container escape AND kernel vulnerabilities"
#   category: security
#   subcategory_hint: method
# - source: semantic_scholar
#   query: "eBPF AND runtime security AND containers"
#   category: security
#   subcategory_hint: mechanism

# Generic placeholders — replace with your actual queries
- source: dblp
  query: your topic a
  category: method
  subcategory_hint: agentic
- source: crossref
  query: your topic b agent survey
  category: survey
  subcategory_hint: hybrid
- source: europepmc
  query: your topic c
  category: application
  subcategory_hint: non-agentic
- source: openalex
  query: your topic d evaluation benchmark
  category: evaluation
  subcategory_hint: hybrid
- source: semantic_scholar
  query: your topic e
  category: method
  subcategory_hint: agentic
